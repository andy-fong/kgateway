apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: example.com
  - name: http-other
    protocol: HTTP
    port: 80
    hostname: other.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
    - protocol: HTTP
      port: 80
      targetPort: test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
spec:
  parentRefs:
  - name: example-gateway
    sectionName: http
  hostnames:
  - "example.com"
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
---
# Route attached to the second HTTP listener (http-other). This listener has no
# listener-level retry policy, so it should receive only the gateway-level retry.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: other-route
spec:
  parentRefs:
  - name: example-gateway
    sectionName: http-other
  hostnames:
  - "other.example.com"
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
---
# Gateway-level retry policy: applies to all listeners. For the http-other
# listener it is the only retry policy, so it should appear on that vhost.
# For the http listener it is overridden by the higher-priority listener-level
# policy below.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: gateway-retry
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  retry:
    attempts: 5
    retryOn:
    - gateway-error
---
# Listener-level retry policy targeting only the http listener via sectionName.
# Higher priority than gateway-retry: should win on the http listener vhost
# (attempts:3) and leave the http-other listener vhost using gateway-retry
# (attempts:5).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: http-listener-retry
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: http
  retry:
    attempts: 3
    retryOn:
    - gateway-error
    - reset
